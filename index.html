<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeKhaFong Production — เช่ากล้อง เลนส์ และอุปกรณ์ถ่ายทำ</title>

    <!-- ==================== FAVICON ==================== -->
    <link rel="icon" type="image/png" href="lekhaFongLogo.png">

    <!-- ==================== FRAMEWORKS & FONTS ==================== -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ==================== CUSTOM STYLES ==================== -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==================== MAIN APP CONTAINER ==================== -->
    <div id="site" class="site v-a"></div>

    <!-- ==================== LOGIN / SIGNUP MODAL ==================== -->
    <div id="login-modal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
        <div id="auth-box" class="bg-[#FFF5F5] w-[90%] max-w-md rounded-2xl shadow-xl overflow-hidden animate-[fadeIn_0.2s_ease-out]">
            
            <div class="flex items-center justify-between border-b border-[#D9B5BA] bg-[#FFF5F5] px-6 pt-5">
                <div role="tablist" aria-label="Account" class="flex gap-8">
                    <button id="tab-login" role="tab" type="button" aria-selected="true" onclick="switchAuthTab('login')"
                        class="relative pb-3 text-base font-semibold transition-colors text-[#4A4A4A]">
                        Log in
                        <span class="auth-tab-bar absolute inset-x-0 bottom-0 h-[2px] rounded-full bg-[#4A4A4A] transition-opacity"></span>
                    </button>
                    <button id="tab-signup" role="tab" type="button" aria-selected="false" onclick="switchAuthTab('signup')"
                        class="relative pb-3 text-base font-semibold transition-colors text-[#7A6E70] hover:text-[#4A4A4A]">
                        Sign up
                        <span class="auth-tab-bar absolute inset-x-0 bottom-0 h-[2px] rounded-full bg-[#4A4A4A] opacity-0 transition-opacity"></span>
                    </button>
                </div>

                <button type="button" onclick="toggleModal('login-modal')" aria-label="Close"
                    class="mb-3 flex h-9 w-9 items-center justify-center rounded-full text-[#7A6E70] transition-colors hover:bg-[#F0D5D0] hover:text-[#4A4A4A]">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div id="form-login" class="block w-full max-w-md mx-auto rounded-2xl bg-[#FFF5F5] px-6 py-8 sm:px-10 text-[#4A4A4A] shadow-[0_1px_0_#D9B5BA,0_24px_48px_-24px_rgba(74,74,74,0.35)]">
                <header class="mb-8 border-b border-dashed border-[#D9B5BA] pb-6">
                    <div class="flex items-center gap-2">
                        <img src="lekhaFongLogo.png" alt="logo" class="w-7 h-7 object-contain">
                        <p class="text-xs font-medium uppercase tracking-[0.18em] text-[#7A6E70] animate-pulse">LeKhaFong</p>
                    </div>
                    <h1 class="mt-2 font-serif text-4xl italic leading-tight">Welcome back.</h1>
                </header>

                <form class="flex flex-col gap-5" onsubmit="handleLoginSubmit(event)">
                    <div class="flex flex-col gap-1.5">
                        <label for="login-email" class="text-sm font-medium">Email</label>
                        <input id="login-email" name="email" type="text" autocomplete="email"
                            placeholder="you@example.com (หรือพิมพ์ admin)"
                            class="w-full rounded-md border border-[#D9B5BA] bg-white/70 px-3 py-2.5 text-[15px] text-[#4A4A4A] placeholder:text-[#B39A9E] transition-colors hover:border-[#C99EA5] focus:border-[#4A4A4A] focus:bg-white focus:outline-none">
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <div class="flex items-baseline justify-between">
                            <label for="login-password" class="text-sm font-medium">Password</label>
                            <button type="button"
                                onclick="const p=document.getElementById('login-password');const s=p.type==='password';p.type=s?'text':'password';this.textContent=s?'Hide':'Show';"
                                class="text-xs text-[#7A6E70] underline-offset-4 hover:text-[#4A4A4A] hover:underline">Show</button>
                        </div>
                        <input id="login-password" name="password" type="password" autocomplete="current-password"
                            class="w-full rounded-md border border-[#D9B5BA] bg-white/70 px-3 py-2.5 text-[15px] text-[#4A4A4A] transition-colors hover:border-[#C99EA5] focus:border-[#4A4A4A] focus:bg-white focus:outline-none">
                    </div>

                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center gap-2 text-[#7A6E70]">
                            <input type="checkbox" name="remember" class="size-4 accent-[#4A4A4A]">
                            Keep me signed in
                        </label>
                        <a href="#" onclick="event.preventDefault()" class="underline decoration-[#D9B5BA] underline-offset-4 hover:decoration-[#4A4A4A]">Forgot password?</a>
                    </div>

                    <div class="mt-2 flex flex-col gap-4">
                        <button type="submit"
                            class="w-full rounded-md bg-[#4A4A4A] px-4 py-3 text-[15px] font-medium text-[#FFF5F5] transition-colors hover:bg-[#3A3A3A] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#4A4A4A]">
                            Log in
                        </button>
                        <p class="text-center text-sm text-[#7A6E70]">
                            New here?
                            <button type="button" onclick="switchAuthTab('signup')"
                                class="font-medium text-[#4A4A4A] underline decoration-[#D9B5BA] underline-offset-4 hover:decoration-[#4A4A4A]">
                                Create an account
                            </button>
                        </p>
                    </div>
                </form>
            </div>

            <div id="form-signup" class="hidden w-full max-w-2xl mx-auto rounded-2xl bg-[#FFF5F5] px-6 py-8 sm:px-10 text-[#4A4A4A] shadow-[0_1px_0_#D9B5BA,0_24px_48px_-24px_rgba(74,74,74,0.35)] max-h-[82vh] overflow-y-auto">
                <header class="mb-8 border-b border-dashed border-[#D9B5BA] pb-6">
                    <div class="flex items-center gap-2">
                        <img src="lekhaFongLogo.png" alt="logo" class="w-7 h-7 object-contain">
                        <p class="text-xs font-medium uppercase tracking-[0.18em] text-[#7A6E70] animate-pulse">LeKhaFong</p>
                    </div>
                    <h1 class="mt-2 font-serif text-4xl italic leading-tight">Create your account.</h1>
                </header>

                <form class="flex flex-col gap-8" onsubmit="handleSignupSubmit(event)">
                    <fieldset class="flex flex-col gap-4">
                        <legend class="mb-4 flex items-center gap-3 text-xs font-medium uppercase tracking-[0.18em] text-[#7A6E70]">
                            <span class="font-serif text-base not-italic text-[#C99EA5]">01</span> About you
                        </legend>
                        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                            <div class="flex flex-col gap-1.5">
                                <label for="su-first" class="text-sm font-medium">First name</label>
                                <input id="su-first" name="firstName" type="text" autocomplete="given-name" required
                                    class="w-full rounded-md border border-[#D9B5BA] bg-white/70 px-3 py-2.5 text-[15px] placeholder:text-[#B39A9E] transition-colors hover:border-[#C99EA5] focus:border-[#4A4A4A] focus:bg-white focus:outline-none">
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label for="su-last" class="text-sm font-medium">Last name</label>
                                <input id="su-last" name="lastName" type="text" autocomplete="family-name" required
                                    class="w-full rounded-md border border-[#D9B5BA] bg-white/70 px-3 py-2.5 text-[15px] placeholder:text-[#B39A9E] transition-colors hover:border-[#C99EA5] focus:border-[#4A4A4A] focus:bg-white focus:outline-none">
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="flex flex-col gap-4">
                        <legend class="mb-4 flex items-center gap-3 text-xs font-medium uppercase tracking-[0.18em] text-[#7A6E70]">
                            <span class="font-serif text-base not-italic text-[#C99EA5]">02</span> Contact
                        </legend>
                        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                            <div class="flex flex-col gap-1.5">
                                <label for="su-email" class="text-sm font-medium">Email</label>
                                <input id="su-email" name="email" type="email" autocomplete="email" required
                                    placeholder="you@example.com"
                                    class="w-full rounded-md border border-[#D9B5BA] bg-white/70 px-3 py-2.5 text-[15px] placeholder:text-[#B39A9E] transition-colors hover:border-[#C99EA5] focus:border-[#4A4A4A] focus:bg-white focus:outline-none">
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label for="su-phone" class="text-sm font-medium">Phone</label>
                                <input id="su-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel"
                                    placeholder="08x xxx xxxx"
                                    class="w-full rounded-md border border-[#D9B5BA] bg-white/70 px-3 py-2.5 text-[15px] placeholder:text-[#B39A9E] transition-colors hover:border-[#C99EA5] focus:border-[#4A4A4A] focus:bg-white focus:outline-none">
                            </div>
                        </div>
                    </fieldset>

                    <fieldset class="flex flex-col gap-4">
                        <legend class="mb-4 flex items-center gap-3 text-xs font-medium uppercase tracking-[0.18em] text-[#7A6E70]">
                            <span class="font-serif text-base not-italic text-[#C99EA5]">03</span> Delivery
                        </legend>
                        <div class="flex flex-col gap-1.5">
                            <div class="flex items-baseline justify-between">
                                <label for="su-address" class="text-sm font-medium">Address</label>
                                <span class="text-xs text-[#7A6E70]">Optional</span>
                            </div>
                            <textarea id="su-address" name="address" rows="3" autocomplete="street-address"
                                placeholder="House no., street, district, province, postcode"
                                class="w-full resize-none rounded-md border border-[#D9B5BA] bg-white/70 px-3 py-2.5 text-[15px] placeholder:text-[#B39A9E] transition-colors hover:border-[#C99EA5] focus:border-[#4A4A4A] focus:bg-white focus:outline-none"></textarea>
                        </div>
                    </fieldset>

                    <div class="flex flex-col-reverse items-center gap-4 border-t border-dashed border-[#D9B5BA] pt-6 sm:flex-row sm:justify-between">
                        <p class="text-sm text-[#7A6E70]">
                            Already have an account?
                            <button type="button" onclick="switchAuthTab('login')"
                                class="font-medium text-[#4A4A4A] underline decoration-[#D9B5BA] underline-offset-4 hover:decoration-[#4A4A4A]">
                                Log in
                            </button>
                        </p>
                        <button type="submit"
                            class="w-full rounded-md bg-[#4A4A4A] px-6 py-3 text-[15px] font-medium text-[#FFF5F5] transition-colors hover:bg-[#3A3A3A] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#4A4A4A] sm:w-auto">
                            Create account
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT APPLICATION ==================== -->
    <script src="script.js"></script>
</body>
</html>
